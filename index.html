<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Calculator Test</title>
</head>

<body>
  <div id="calc-result">
    <input id="calc-input-text"></input>
    <p id="calc-result-text"></p>
  </div>
  
  <div id="calc-buttons">
    <div id="buttons">
      <button id="nine">9</button>
      <button id="eight">8</button>
      <button id="seven">7</button>
      <button id="AC">AC</button>
      <button id="DEL">DEL</button>
      <button id="openBracket">(</button>
      <button id="six">6</button>  
      <button id="five">5</button>  
      <button id="four">4</button>  
      <button id="plus">+</button>  
      <button id="minus">-</button>
      <button id="closeBracket">)</button>  
      <button id="three">3</button>
      <button id="two">2</button>
      <button id="one">1</button>
      <button id="times">*</button>
      <button id="divide">/</button>
      <button id="power">^</button>
      <button id="zero">0</button>
      <button id="doubleZero">00</button>
      <button id="decimal">.</button>
      <button id="squareRoot">√</button>
      <button id="equal">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
